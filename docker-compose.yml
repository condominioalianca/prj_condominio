version: '3.8'

services:
  novaalianca-backend:
    build:
      context: ./back_end/novaalianca
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/novaalianca-*.jar
    container_name: novaalianca-backend
    ports:
      - "8086:8086"
    environment:
      - DOCKER=true
      - APP_PROFILE=test
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - INTER_CERT_PATH=${INTER_CERT_PATH}
      - INTER_CERT_PASSWORD=${INTER_CERT_PASSWORD}
      - INTER_CLIENT_ID=${INTER_CLIENT_ID}
      - INTER_CLIENT_SECRET=${INTER_CLIENT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CRON_SCHEDULE_EXTRATO=${CRON_SCHEDULE_EXTRATO}
      - CRON_SCHEDULE_VALIDA_ENVIO=${CRON_SCHEDULE_VALIDA_ENVIO}
      - CRON_SCHEDULE_RECUPERA_BOLETO=${CRON_SCHEDULE_RECUPERA_BOLETO}
      - CRON_SCHEDULE_ENVIA_EMAIL=${CRON_SCHEDULE_ENVIA_EMAIL}
      - UPLOAD_DIR=/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "C:/ARQUIVOS_SITES/NOVA_ALINCA:/app/uploads"
    restart: always
