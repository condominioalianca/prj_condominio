services:

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"     # Interface Web do Jenkins
      - "50000:50000"   # Comunicação com agentes Jenkins
    volumes:
      # Volume persistente: configurações, jobs, plugins, credentials
      - jenkins_home:/var/jenkins_home
      # Monta o socket do Docker do host para permitir builds de imagens
      - //var/run/docker.sock:/var/run/docker.sock
    # Necessário no Docker Desktop (Windows) para acessar o socket do Docker
    user: root
    networks:
      - jenkins_net

networks:
  jenkins_net:
    driver: bridge

volumes:
  jenkins_home:
    driver: local
